[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

addopts =
    -q
    -ra
    --strict-markers
    --tb=short
    --color=yes

markers =
    tc(n): So thu tu testcase trong TC_Genius_Web_Automation.xlsx
    smoke: Bo smoke nhanh (~3 phut), khong ton credit
    ui: Kiem tra UI tinh, khong ton credit
    mock: Dung page.route / set_offline, khong ton credit
    credit: TON CREDIT THAT - chi chay 1 lan/ngay sau khi quota reset
    e2e: Luong xuyen suot
    manual: Khong tu dong hoa duoc, chay tay

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
